name: Picnic Desk
version: "1.0.5"
slug: picnic_desk
description: A desktop Picnic shop in the Home Assistant sidebar
url: https://github.com/KJori/picnic_ha_ui
arch:
  - amd64
  - aarch64
ingress: true
ingress_port: 8099
# Home Assistant restarts the app when this port stops answering.
watchdog: "tcp://[HOST]:[PORT:8099]"
panel_icon: mdi:basket
panel_title: Picnic
# Every user sees it in the sidebar, so accounts that are not administrators
# can open it too; the app itself decides who may use it: the users named in
# allowed_users, or else whoever signed in to Picnic (see DOCS.md, "Who can
# use it").
panel_admin: false
# Backups may end up on a NAS or in the cloud: they get no Picnic session
# (signing in again after a restore is enough), no order history, and no
# pictures (all of these come back by themselves). Nor the payment being
# watched: a restore must not pick up an old payment again.
backup_exclude:
  - "*/picture-cache/**"
  - "*/auth.json"
  - "*/payment.json"
  - "*/history.json"
  - "*/recipe_prices.json"
options:
  country_code: NL
  language: en
  picture_cache_mb: 500
  allowed_users: []
schema:
  country_code: list(NL|DE|FR)
  language: list(en|nl|de|fr)
  picture_cache_mb: int(50,10000)
  allowed_users:
    - str
