configuration:
  country_code:
    name: Land
    description: Het land van je Picnic-account.
  language:
    name: Taal
    description: De taal van de schermen van de app. Productnamen en -teksten zijn altijd die van Picnic.
  picture_cache_mb:
    name: Ruimte voor afbeeldingen (MB)
    description: Hoeveel schijfruimte de bewaarde product- en receptafbeeldingen mogen innemen. Als het vol is, maken de langst niet getoonde plaats.
  allowed_users:
    name: Gebruikers
    description: De Home Assistant-gebruikersnamen (geen weergavenamen) die Picnic hier mogen gebruiken; niemand anders kan dat, ook beheerders niet. Leeg betekent alleen degene die op Picnic is ingelogd.
