configuration:
  country_code:
    name: Pays
    description: Le pays de votre compte Picnic.
  language:
    name: Langue
    description: La langue des écrans de l'app. Les noms et textes des produits sont toujours ceux de Picnic.
  picture_cache_mb:
    name: Place pour les images (Mo)
    description: L'espace disque que peuvent occuper les images de produits et de recettes conservées. Une fois plein, les moins récemment affichées laissent la place.
  allowed_users:
    name: Utilisateurs
    description: Les noms d'utilisateur Home Assistant (pas les noms affichés) qui peuvent utiliser Picnic ici ; personne d'autre, administrateurs compris. Vide signifie seulement la personne connectée à Picnic.
