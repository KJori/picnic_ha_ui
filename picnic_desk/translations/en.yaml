configuration:
  country_code:
    name: Country
    description: The country of your Picnic account.
  language:
    name: Language
    description: The language of the app's screens. Product names and texts are always Picnic's own.
  picture_cache_mb:
    name: Room for pictures (MB)
    description: How much disk space the kept product and recipe pictures may take. The ones shown longest ago make room when it is full.
  allowed_users:
    name: Users
    description: The Home Assistant user names (not display names) that may use Picnic here; nobody else can, administrators included. Empty means only the person who signed in to Picnic.
